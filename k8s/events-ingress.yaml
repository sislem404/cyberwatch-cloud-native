apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: events-ingress

spec:
  ingressClassName: traefik

  rules:
    - http:
        paths:
          # Frontend React
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80

          # Events Service
          - path: /events
            pathType: Prefix
            backend:
              service:
                name: events-service
                port:
                  number: 8080

          # Detection Service
          - path: /alerts
            pathType: Prefix
            backend:
              service:
                name: detection-service
                port:
                  number: 8080