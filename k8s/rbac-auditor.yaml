apiVersion: v1
kind: ServiceAccount
metadata:
  name: cyberwatch-auditor

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cyberwatch-pod-reader

rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cyberwatch-auditor-binding

subjects:
  - kind: ServiceAccount
    name: cyberwatch-auditor

roleRef:
  kind: Role
  name: cyberwatch-pod-reader
  apiGroup: rbac.authorization.k8s.io